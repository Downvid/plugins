name: 探测写权限
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 试着提交
        run: |
          echo "probe $(date -u +%s)" >> .probe
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .probe
          git commit -m "chore: probe write access"
          git push && echo "PUSH_OK" || echo "PUSH_FAILED"
